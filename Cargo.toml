[package]
name = "mmp"
version = "0.1.0"
edition = "2024"
description = "A GTK4 music player (Rust port)"

[dependencies]
# GTK4 + Relm4 (Elm-inspired GUI framework)
gtk4 = { version = "0.11", package = "gtk4" }
glib = "0.22"
relm4 = { version = "0.11", features = ["macros"] }
relm4-components = "0.11"

# Rust-native audio playback and metadata
lofty = "0.24"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "id3v1", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

# SQLite for library and playlists
rusqlite = { version = "0.35", features = ["bundled"] }

# Utilities
walkdir = "2"
rand = "0.9"
dirs = "6"
